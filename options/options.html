<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medicus Assistant - Ustawienia</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Medicus Assistant - Ustawienia</h1>
            <p>Panel generowany automatycznie na podstawie dostępnych opcji.</p>
        </header>

        <section id="presets-root" class="presets-root"></section>

        <section id="settings-root" class="settings-root"></section>
        <section id="backup-root" class="backup-root"></section>

        <footer class="actions">
            <button id="save-btn" type="button">Zapisz zmiany</button>
            <button id="reset-all-btn" type="button" class="secondary">Przywróć domyślne</button>
            <span id="status" class="status" aria-live="polite"></span>
        </footer>
    </main>

    <script src="../scripts/settings.js"></script>
    <script src="options.js"></script>
</body>
</html>
